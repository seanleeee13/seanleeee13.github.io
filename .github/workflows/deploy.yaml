name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Base Deploy Directory
        run: mkdir -p dist
      - name: Set up Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: gff/yarn.lock
      - name: Install Dependencies
        run: |
          cd gff
          yarn install
      - name: Build Files
        run: |
          cd gff
          yarn build
      - name: Move GFF Build to Subdirectory
        run: cp -r ./gff/dist ./dist/gff
      - name: Deploy Website
        uses: peaceiris/actions-gh-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages