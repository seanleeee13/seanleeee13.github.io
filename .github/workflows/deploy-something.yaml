name: Deploy Workspace [something] to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - "something/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-something.yaml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # - name: Run Linter
      #   run: pnpm --filter something lint
      - name: Build Project
        run: pnpm --filter something build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./something/dist"
      - name: Deploy Website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./something/dist
          publish_branch: gh-pages
          destination_dir: something
          keep_files: true