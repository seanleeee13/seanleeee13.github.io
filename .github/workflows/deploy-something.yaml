name: Deploy Workspace [something] to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - "something/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-something.yaml"
      - "apply-change"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # - name: Run Linter
      #   run: pnpm --filter something lint
      - name: Build Project
        run: pnpm --filter something build
      - name: Move File
        run: |
          mkdir -p dist
          cp -r something/dist/. dist/something
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4