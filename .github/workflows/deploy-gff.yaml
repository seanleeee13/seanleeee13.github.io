name: Deploy Workspace [gff] to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - "gff/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-gff.yaml"
      - "apply-change"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # - name: Run Linter
      #   run: pnpm --filter gff lint
      - name: Build Project
        run: pnpm --filter gff build
      - name: Deploy Gff
        uses: s0/git-publish-subdir-action@v2.6.0
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: gff/dist
          TARGET_DIR: gff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAR_GLOBS: "gff/**"