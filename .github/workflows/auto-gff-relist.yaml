name: Auto Run [gff/relist] with Cron
on:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/auto-gff-relist.yaml"
      - "apply-change.txt"
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Linter
        run: pnpm --filter auto lint
      - name: Run Script
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm dlx --allow-build=esbuild tsx auto/src/gff/relist.ts